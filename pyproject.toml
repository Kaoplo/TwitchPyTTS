[tool.ruff]
target-version = "py312"
line-length = 88

# Ignore auto-generated Qt Designer / PySide UI files
extend-exclude = [
    "src/gui/ui/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]

ignore = [
    "UP004", # Allow Class inherits from object if needed by Qt wrappers
]

[tool.ruff.lint.isort]
known-first-party = ["src"]