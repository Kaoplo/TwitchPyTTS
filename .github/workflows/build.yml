name: Build Production Binary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Run build inside Ubuntu 20.04 container for backward glibc compatibility
    container:
      image: ubuntu:20.04

    steps:
      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            build-essential \
            ccache \
            git \
            patchelf \
            zstd \
            libgl1-mesa-glx \
            libegl1-mesa \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Setup Virtual Environment & Dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install nuitka
          # Install project dependencies
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Binary with Nuitka
        run: |
          . .venv/bin/activate
          python3 -m nuitka \
            --onefile \
            --standalone \
            --main=src \
            --output-filename=twitchpytts \
            --remove-output \
            --lto=yes \
            --strip \
            --disable-console \
            --enable-plugin=pyside6 \
            --noinclude-qt-translations \
            --include-package-data=piper \
            --include-package-data=onnxruntime \
            --include-data-dir=$(python3 -c "import piper, os; print(os.path.dirname(piper.__file__))")/espeak-ng-data=espeak-ng-data

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchpytts-linux-x86_64
          path: twitchpytts
          if-no-files-found: error