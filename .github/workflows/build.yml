name: Build Production Binary

on:
  push:
    branches:
      - main
      - nightly
  pull_request:
    branches:
      - main
      - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System C/C++ & Qt Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            ccache \
            patchelf \
            zstd \
            libgl1-mesa-glx \
            libegl1-mesa \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install nuitka[onefile]
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Build Binary with Nuitka
        run: |
          python -m nuitka \
            --onefile \
            --standalone \
            --main=src \
            --output-filename=twitchpytts \
            --remove-output \
            --lto=yes \
            --enable-plugin=pyside6 \
            --noinclude-qt-translations \
            --include-package-data=piper \
            --include-package-data=onnxruntime \
            --include-package-data=certifi \
            --include-data-dir=$(python -c "import piper, os; print(os.path.dirname(piper.__file__))")/espeak-ng-data=espeak-ng-data

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchpytts-linux-x86_64-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
          path: twitchpytts
          if-no-files-found: error