name: Build Production Binary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install System Dependencies & Python 3.12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y \
            software-properties-common \
            build-essential \
            ccache \
            git \
            patchelf \
            zstd \
            libgl1-mesa-glx \
            libegl1-mesa \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

          # Add deadsnakes PPA for Python 3.12 on Ubuntu 20.04
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update && apt-get install -y \
            python3.12 \
            python3.12-venv \
            python3.12-dev

      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Setup Virtual Environment & Dependencies
        run: |
          # Use python3.12 explicitly to build the venv
          python3.12 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install nuitka
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Binary with Nuitka
        run: |
          . .venv/bin/activate
          python3 -m nuitka \
            --onefile \
            --standalone \
            --main=src \
            --output-filename=twitchpytts \
            --remove-output \
            --lto=yes \
            --strip \
            --disable-console \
            --enable-plugin=pyside6 \
            --noinclude-qt-translations \
            --include-package-data=piper \
            --include-package-data=onnxruntime \
            --include-data-dir=$(python3 -c "import piper, os; print(os.path.dirname(piper.__file__))")/espeak-ng-data=espeak-ng-data

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitchpytts-linux-x86_64-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
          path: twitchpytts
          if-no-files-found: error